command = "/home/kevin/.local/libexec/ntm/codex-0.153.0-server-model-v2/codex-x86_64-unknown-linux-gnu"
runtime_sha256 = "c6ff5f0b41e795cd9058c47aa7117ca696d2925fec82cfe106037b499fff8168"
broker_command = "/home/kevin/.local/bin/caam-zai-codex-v18"
broker_command_sha256 = "51d033a359e2d2bcbf2ba37d6d0ce294cc29950046c0741c7bd714577491890d"
credential_bridge_command = "/home/kevin/.local/libexec/ntm/bridge-provider-v6/ntm-provider-bridge.exe"
