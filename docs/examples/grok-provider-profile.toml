# Non-secret example used for local provider-doctor validation.
# Review and re-hash the complete redacted manifest before adapting it to a
# different account, model, endpoint, runtime version, policy, signing-bridge
# path, or signing-bridge SHA-256. Never put a credential in this file. The
# bridge pin is also bound directly by every signed Grok receipt.
#
# ACP cancellation is narrowly agent-scoped: NTM writes `session/cancel` and
# accepts it only when the original `session/prompt` response says
# `stopReason=cancelled`. That receipt does not prove xAI cloud inference
# stopped. Local process-tree termination/reaping is recorded separately.
#
# Observe-profile hashed manifest:
# provider=xai;account=local-cached;model=grok-4.6;endpoint=https://api.x.ai/v1;runtime=grok;runtime_version=1.0.13;policy=grok-readonly-ci;receipt_bridge_sha256=a17a319c482f8dd61607a8065d0b8a6d97249cf370d5b0bd556d9feb89e4cf37
# Workspace-write-profile hashed manifest:
# provider=xai;account=local-cached;model=grok-4.6;endpoint=https://api.x.ai/v1;runtime=grok;runtime_version=1.0.13;policy=grok-workspace-write-ci;receipt_bridge_sha256=a17a319c482f8dd61607a8065d0b8a6d97249cf370d5b0bd556d9feb89e4cf37

[provider_profiles."grok-observe"]
provider = "xai"
account_alias = "local-cached"
model = "grok-4.6"
endpoint = "https://api.x.ai/v1"
runtime = "grok"
runtime_version = "1.0.13"
config_sha256 = "7ffae0b32bda9fca54d79c7eb3b0a85d8d5b1bd82d208f8a097c1f58c1b984eb"
command = "/usr/local/libexec/ntm/grok-1.0.13"
runtime_home = "/home/kevin/orch-homes/grok-observe/.grok"
credential_bridge_command = "/home/kevin/.local/libexec/ntm/bridge-provider-v6/ntm-provider-bridge.exe"
credential_bridge_command_sha256 = "a17a319c482f8dd61607a8065d0b8a6d97249cf370d5b0bd556d9feb89e4cf37"
automation_policy = "grok-readonly-ci"
exact_target_only = true
probe_required = false

[provider_profiles."grok-workspace-write"]
provider = "xai"
account_alias = "local-cached"
model = "grok-4.6"
endpoint = "https://api.x.ai/v1"
runtime = "grok"
runtime_version = "1.0.13"
config_sha256 = "e3aa3521d84356959466fb54115b24ad59ed69828b2b87058a5e58e5794b2824"
command = "/usr/local/libexec/ntm/grok-1.0.13"
runtime_home = "/home/kevin/orch-homes/grok-workspace-write/.grok"
credential_bridge_command = "/home/kevin/.local/libexec/ntm/bridge-provider-v6/ntm-provider-bridge.exe"
