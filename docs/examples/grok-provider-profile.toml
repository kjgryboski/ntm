# Non-secret example used for local provider-doctor validation.
# Review and re-hash the complete redacted manifest before adapting it to a
# different account, model, endpoint, runtime version, or policy. Never put a
# credential in this file.
#
# ACP cancellation is narrowly agent-scoped: NTM writes `session/cancel` and
# accepts it only when the original `session/prompt` response says
# `stopReason=cancelled`. That receipt does not prove xAI cloud inference
# stopped. Local process-tree termination/reaping is recorded separately.
#
# Observe-profile hashed manifest:
# provider=xai;account=local-cached;model=grok-4.6;endpoint=https://api.x.ai/v1;runtime=grok;runtime_version=1.0.13;policy=grok-readonly-ci
# Workspace-write-profile hashed manifest:
# provider=xai;account=local-cached;model=grok-4.6;endpoint=https://api.x.ai/v1;runtime=grok;runtime_version=1.0.13;policy=grok-workspace-write-ci

[provider_profiles."grok-observe"]
provider = "xai"
account_alias = "local-cached"
model = "grok-4.6"
endpoint = "https://api.x.ai/v1"
runtime = "grok"
runtime_version = "1.0.13"
config_sha256 = "8ef1037867e53a83a12e3170773f2d5b510fd7b3c25dbf002eedb2e28077d7b4"
command = "/usr/local/libexec/ntm/grok-1.0.13"
automation_policy = "grok-readonly-ci"
exact_target_only = true
probe_required = false

[provider_profiles."grok-workspace-write"]
provider = "xai"
account_alias = "local-cached"
model = "grok-4.6"
endpoint = "https://api.x.ai/v1"
runtime = "grok"
runtime_version = "1.0.13"
config_sha256 = "a8dd5c6add08b6333c148fcff0ccbfdf81e6bf5b61ce3c645bc0112c3fa97958"
command = "/usr/local/libexec/ntm/grok-1.0.13"
automation_policy = "grok-workspace-write-ci"
exact_target_only = true
probe_required = false

# Primary Z.ai subscription lane. CAAM/the owner provisions the isolated
# CODEX_HOME and its non-secret config.toml/models.json, then hashes that
# manifest into config_sha256. Do not place a key in this file. The pinned
# runtime is the local server-model observability fork of official rust-v0.153.0
# at Codex commit ae8e7ee; the executable digest below is the authority.
[provider_profiles."zai-codex-kevin-v10"]
provider = "zai"
account_alias = "kevin"
model = "glm-5.3"
endpoint = "https://api.z.ai/api/v1"
runtime = "codex"
runtime_version = "0.153.0"
credential_class = "coding_plan"
billing_class = "coding_plan"
entitlement = "codex_responses"
config_sha256 = "3c4d0bd7ec1b2e852b2acfd5f7500988f57ba587a3331d742c3fa44719ef4c1e"
command = "/home/kevin/.local/libexec/ntm/codex-0.153.0-server-model-v1/codex-x86_64-unknown-linux-gnu"
runtime_sha256 = "b041039d5c6856dd94c649f9fc56d26ec7c83aa60038b323d9299d3e79ce9705"
broker_command = "/home/kevin/.local/bin/caam-zai-codex-v14"
broker_command_sha256 = "6cd9fad4fa68a291133014b6ea3c62283f1b6fa077a2aea7349609ea1c1a5472"
credential_bridge_command = "/home/kevin/.local/libexec/ntm/bridge-zai-codex-v3/ntm-provider-bridge.exe"
credential_bridge_command_sha256 = "1f0067ea3c9a56a1266c2c2594b3c6e7616470473d53443470bbe07c0389e21f"
broker_credential_id = "ntm.zai.coding_plan.kevin"
runtime_home = "/home/kevin/orch-homes/zai-codex-kevin-v10/.codex"
automation_policy = "zai-codex-workspace-write-v1"
exact_target_only = true
probe_required = true

